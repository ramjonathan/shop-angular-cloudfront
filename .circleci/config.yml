version: 2.1

orbs:
  codecov: codecov/codecov@5.0.3

jobs:
  test-angular:
    docker:
      - image: cimg/node:20.11-browsers
    steps:
      - checkout

      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
            - node-deps-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: node-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules

      - run:
          name: Run tests and collect coverage
          command: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - codecov/upload

workflows:
  version: 2.1
  build-test:
    jobs:
      - test-angular
